stages:
  - Build
  - Deploy

variables:
  POD_TAG: "$CI_COMMIT_BRANCH"
  DEPLOY_DIR: "/data/java/service"

Build:
  stage: Build
  tags:
    - genchuan-cloud-runner
  script:
    - echo "===== 开始Maven打包 ====="
    - mvn clean package -Dmaven.test.skip=true

    - echo "===== 创建产物目录 ====="
    - mkdir -p jars/
    - source ci-modules.conf
    # 循环打包：输出 服务名.jar
    - |
      for module in "${!MODULE_JAR_MAP[@]}"; do
        jarPath=${MODULE_JAR_MAP[$module]}
        echo "收集模块：$jarPath"
        cp -f ${jarPath}/target/*.jar jars/${module}.jar 2>/dev/null || echo "⚠️  $module 无jar包，跳过"
      done

  artifacts:
    name: "jars-${CI_COMMIT_BRANCH}"
    paths:
      - jars/
    expire_in: 1 day
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

# 部署：只在 master 执行
Deploy:
  stage: Deploy
  tags:
    - genchuan-cloud-runner
  only:
    - master
  script:
    - echo "===== 开始部署 ====="
    - cp -rf jars/* ${DEPLOY_DIR}/
    - cd ${DEPLOY_DIR}
    # 加载服务列表
    - source ci-modules.conf
    # ✅ 服务启动
    - |
      for module in "${!MODULE_JAR_MAP[@]}"; do
        echo -e "\n====================================="
        echo " 部署服务：$module"
        echo "====================================="
        ./start.sh ${module}
      done
    - echo -e "\n✅ 所有服务部署完成！"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure