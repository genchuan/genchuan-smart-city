stages:
  - BuildAndDeploy
variables:
  POD_TAG: "$CI_COMMIT_BRANCH"
  DEPLOY_DIR: "/data/java/service"

Build:
  stage: BuildAndDeploy
  tags:
    - genchuan-cloud-runner
  script:
    - echo "===== 开始Maven打包 ====="
    - mvn clean package -Dmaven.test.skip=true
    - echo "===== 创建产物目录 ====="
    - |
      declare -A MODULE_JAR_MAP=(
          ["yudao-gateway"]="yudao-gateway"
          ["yudao-module-system-server"]="yudao-module-system/yudao-module-system-server"
          ["yudao-module-infra-server"]="yudao-module-infra/yudao-module-infra-server"
          ["genchuan-module-studentmgmt-server"]="genchuan-module-education-teaching/genchuan-module-studentmgmt-server"
      )
      for module in "${!MODULE_JAR_MAP[@]}"; do
        jarPath=${MODULE_JAR_MAP[$module]}
        echo "====================================="
        echo "收集模块：$module"
        echo "模块路径：$jarPath"
        echo "====================================="
        cp -vf ${jarPath}/target/${module}.jar ${DEPLOY_DIR}/${module}.jar 2>/dev/null
        cd ${DEPLOY_DIR}
        sh ./start.sh ${module}
      done
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure