stages:
  - Build
  - Deploy

variables:
  POD_TAG: "$CI_COMMIT_BRANCH"
  DEPLOY_DIR: "/data/java/service"

Build:
  stage: Build
  tags:
    - genchuan-cloud-runner
  script:
    - echo "===== 开始Maven打包 ====="
    - mvn clean package -Dmaven.test.skip=true
    - echo "===== 创建产物目录 ====="
    - source ci-modules.conf
    - |
      #!/bin/bash
      set +e
      cat ci-modules.conf | while IFS='=' read moduleName jarPath; do
        echo "====================================="
        echo "模块名：$moduleName"
        echo "JAR路径：$jarPath"
        echo "目标：${DEPLOY_DIR}/${moduleName}.jar"
        echo "====================================="

        # 直接复制！不经过产物
        cp -f ${jarPath}/target/*.jar ${DEPLOY_DIR}/${moduleName}.jar 2>/dev/null

        if [ -f "${DEPLOY_DIR}/${moduleName}.jar" ]; then
          echo "✅ 复制成功：$moduleName"
        else
          echo "⚠️  无jar包，跳过：$moduleName"
        fi
      done
      set -e
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

# 部署：只在 master 执行
Deploy:
  stage: Deploy
  tags:
    - genchuan-cloud-runner
  only:
    - master
  script:
    - echo "===== 开始部署 ====="
    - cd ${DEPLOY_DIR}
    # 加载服务列表
    - source ci-modules.conf
    # ✅ 服务启动
    - |
      for module in "${!MODULE_JAR_MAP[@]}"; do
        echo -e "\n====================================="
        echo " 部署服务：$module"
        echo "====================================="
        ./start.sh ${module}
      done
    - echo -e "\n✅ 所有服务部署完成！"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure