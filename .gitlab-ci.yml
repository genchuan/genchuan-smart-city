stages:
  - 代码编译
  - 镜像构建

variables:
  DOCKER_REGISTRY: "harbor.genchuan.cn"
  DOCKER_USERNAME: "guoyuanhong"
  DOCKER_PASSWORD: "Gyh12345"
  MAVEN_IMAGE: "harbor.genchuan.cn/library/maven:3.9.6-alpine-jdk17-docker"

代码编译:
  stage: 代码编译
  image: $MAVEN_IMAGE
  script:
    - mvn clean package -Dmaven.test.skip=true
  only:
    - master
镜像构建:
  stage: 镜像构建
  image: $MAVEN_IMAGE
  script:
    - echo "$DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u $DOCKER_USERNAME --password-stdin
    - |
      # Alpine兼容的镜像构建方案
      for module in "yudao-gateway" "yudao-module-bpm-biz" "yudao-module-infra-biz" "yudao-module-smartcity-biz" "yudao-module-system-biz"; do
        case $module in
          "yudao-gateway") jar_path="yudao-gateway" ;;
          "yudao-module-bpm-biz") jar_path="yudao-module-bpm/yudao-module-bpm-biz" ;;
          "yudao-module-infra-biz") jar_path="yudao-module-infra/yudao-module-infra-biz" ;;
          "yudao-module-smartcity-biz") jar_path="yudao-module-smartcity/yudao-module-smartcity-biz" ;;
          "yudao-module-system-biz") jar_path="yudao-module-system/yudao-module-system-biz" ;;
        esac
        
        docker build \
          --build-arg MODULE_NAME=$module \
          --build-arg JAR_PATH=$jar_path \
          -t $DOCKER_REGISTRY/sccsgl/$module:latest .
          
        docker push $DOCKER_REGISTRY/sccsgl/$module:latest
      done
  only:
    - master
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure