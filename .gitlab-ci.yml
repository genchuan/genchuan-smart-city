stages:
  - BuildAndPush
  
variables:
  DOCKER_REGISTRY: "" #私有的或者公有的仓库地址
  DOCKER_USERNAME: "" #账号
  DOCKER_PASSWORD: "" #密码
  MAVEN_IMAGE: "maven:3.9.6-alpine-jdk17-docker"
  DOCKER_BUILDKIT: "1"  # 启用 Docker BuildKit 提高构建速度
  POD_TAG: "$CI_COMMIT_BRANCH"  # Podman 镜像标签

BuildAndPush:
  stage: BuildAndPush
  image: $MAVEN_IMAGE
  variables:
    DOCKER_BUILDKIT: "0"
#  rules: # 新增只有master分支才进行构建
#    - if: $CI_COMMIT_BRANCH == "master"
#      when: always
#    - when: never
  script:
    - mvn clean package -Dmaven.test.skip=true
    - echo "$DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u $DOCKER_USERNAME --password-stdin
    - |
      # 遍历所有模块并构建 Docker 镜像
      for module in "yudao-gateway" "gc-module-datacenter-server" "gc-module-industry-server" "yudao-module-bpm-server" "yudao-module-infra-server" "yudao-module-system-server"; do
        case $module in
          "yudao-gateway") jar_path="yudao-gateway" ;;
          "gc-module-datacenter-server") jar_path="gc-module-datacenter/gc-module-datacenter-server" ;;
          "gc-module-industry-server") jar_path="gc-module-industry/gc-module-industry-server" ;;
          "yudao-module-bpm-server") jar_path="yudao-module-bpm/yudao-module-bpm-server" ;;
          "yudao-module-infra-server") jar_path="yudao-module-infra/yudao-module-infra-server" ;;
          "yudao-module-system-server") jar_path="yudao-module-system/yudao-module-system-server" ;;
        esac
        
        docker build \
          --build-arg MODULE_NAME="$module" \
          --build-arg JAR_PATH="$jar_path" \
          -t "$DOCKER_REGISTRY/sccsgl/$module:$POD_TAG" .
        # 推送镜像到仓库
        docker push "$DOCKER_REGISTRY/sccsgl/$module:$POD_TAG"
      done

  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure