stages:
  - build
  - archive_jar
variables:
  MAVEN_SKIP_TEST: "-Dmaven.test.skip=true"
  ARCHIVE_ROOT: "/home/data/java/$(date +%Y-%m-%d)"
  MODULES: "yudao-gateway yudao-module-system-server yudao-module-infra-server yudao-module-bpm-server genchuan-module-envirhealth-server genchuan-module-facility-server genchuan-module-data-server genchuan-module-evaluate-server genchuan-module-park-server genchuan-module-kitchen-server"
build:
  stage: build
  script:
    - echo "===== 开始编译 ====="
    - mvn clean package $MAVEN_SKIP_TEST -U | tee maven-build.log
    - echo "===== 编译完成 ====="
  artifacts:
    paths:
      - "**/target/*.jar" 
      - maven-build.log
    expire_in: 1h
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

archive_jar:
  stage: archive_jar
  script:
    - mkdir -p $ARCHIVE_ROOT
    - chown -R gitlab-runner:gitlab-runner $ARCHIVE_ROOT
    - declare -A JAR_PATH_MAP=(
        ["yudao-gateway"]="yudao-gateway"
        ["yudao-module-system-server"]="yudao-module-system/yudao-module-system-server"
        ["yudao-module-infra-server"]="yudao-module-infra/yudao-module-infra-server"
        ["yudao-module-bpm-server"]="yudao-module-bpm/yudao-module-bpm-server"
        ["genchuan-module-envirhealth-server"]="genchuan-module-urban/genchuan-module-envirhealth/genchuan-module-envirhealth-server"
        ["genchuan-module-facility-server"]="genchuan-module-urban/genchuan-module-facility/genchuan-module-facility-server"
        ["genchuan-module-data-server"]="genchuan-module-datahub/genchuan-module-data/genchuan-module-data-server"
        ["genchuan-module-evaluate-server"]="genchuan-module-datahub/genchuan-module-evaluate/genchuan-module-evaluate-server"
        ["genchuan-module-park-server"]="genchuan-module-park/genchuan-module-park-server"
        ["genchuan-module-kitchen-server"]="genchuan-module-marketsupervision/genchuan-module-kitchen/genchuan-module-kitchen-server"
      )
    - for module in $MODULES; do
      jarPath=${JAR_PATH_MAP[$module]}
      jarFile="${jarPath}/target/${module}.jar"
      cp -f "$jarFile" "$ARCHIVE_ROOT/${module}.jar"
      done
    - echo "===== 归档完成，当前目录文件列表 ====="
    - ls -lh $ARCHIVE_ROOT
    - echo "===== JAR包归档完成 ====="
  dependencies:
    - build
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
  only:
    - genchuan-opengauss-master

