stages:
  - BuildAndPush
  
variables:
  DOCKER_REGISTRY: "harbor.genchuan.cn"
  DOCKER_USERNAME: "guoyuanhong"
  DOCKER_PASSWORD: "Gyh12345"
  MAVEN_IMAGE: "harbor.genchuan.cn/library/maven:3.9.6-alpine-jdk17-docker"
  DOCKER_BUILDKIT: "1"  # 启用 Docker BuildKit 提高构建速度
  POD_TAG: "prod-jdk17"  # Podman 镜像标签

BuildAndPush:
  stage: BuildAndPush
  image: $MAVEN_IMAGE
  variables:
    DOCKER_BUILDKIT: "0"
  script:
    - mvn clean package -Dmaven.test.skip=true
    - echo "$DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u $DOCKER_USERNAME --password-stdin
    - |
      # 遍历所有模块并构建 Docker 镜像
      for module in "yudao-gateway" "yudao-module-ai-server" "yudao-module-bpm-server" "yudao-module-crm-server" "yudao-module-erp-server" "yudao-module-infra-server" "yudao-module-member-server" "yudao-module-mp-server" "yudao-module-pay-server" "yudao-module-report-server" "yudao-module-smartcity-server" "yudao-module-system-server" "yudao-server" ; do
        case $module in
          "yudao-gateway") jar_path="yudao-gateway" ;;
          "yudao-module-ai-server") jar_path="yudao-module-ai/yudao-module-ai-server" ;;
          "yudao-module-bpm-server") jar_path="yudao-module-bpm/yudao-module-bpm-server" ;;
          "yudao-module-crm-server") jar_path="yudao-module-crm/yudao-module-crm-server" ;;
          "yudao-module-erp-server") jar_path="yudao-module-erp/yudao-module-erp-server" ;;
          "yudao-module-infra-server") jar_path="yudao-module-infra/yudao-module-infra-server" ;;
          "yudao-module-member-server") jar_path="yudao-module-member/yudao-module-member-server" ;;
          "yudao-module-mp-server") jar_path="yudao-module-mp/yudao-module-mp-server" ;;
          "yudao-module-pay-server") jar_path="yudao-module-pay/yudao-module-pay-server" ;;
          "yudao-module-report-server") jar_path="yudao-module-report/yudao-module-report-server" ;;
          "yudao-module-smartcity-server") jar_path="yudao-module-smartcity/yudao-module-smartcity-server" ;;
          "yudao-module-system-server") jar_path="yudao-module-system/yudao-module-system-server" ;;
          "yudao-server") jar_path="yudao-server" ;;
        esac
        
        docker build \
          --build-arg MODULE_NAME="$module" \
          --build-arg JAR_PATH="$jar_path" \
          -t "$DOCKER_REGISTRY/sccsgl/$module:$POD_TAG" .
        # 推送镜像到仓库
        docker push "$DOCKER_REGISTRY/sccsgl/$module:$POD_TAG"
      done

  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure