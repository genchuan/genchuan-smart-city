stages:
  - BuildAndPush
  
variables:
  DOCKER_REGISTRY: "harbor.genchuan.cn"
  DOCKER_USERNAME: "guoyuanhong"
  DOCKER_PASSWORD: "Gyh12345"
  MAVEN_IMAGE: "harbor.genchuan.cn/library/maven:3.9.6-alpine-jdk17-docker"
  DOCKER_BUILDKIT: "1"  # 启用 Docker BuildKit 提高构建速度
  POD_TAG: "$CI_COMMIT_BRANCH"  # Podman 镜像标签


BuildAndPush:
  stage: BuildAndPush
  image: $MAVEN_IMAGE
  variables:
    DOCKER_BUILDKIT: "0"
#  rules: # 新增只有master分支才进行构建
#    - if: $CI_COMMIT_BRANCH == "master"
#      when: always
#    - when: never
  script:
    - mvn clean package -Dmaven.test.skip=true
    - echo "$DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u $DOCKER_USERNAME --password-stdin
   
    - |
      declare -A MODULE_JAR_MAP=(
        ["yudao-gateway"]="yudao-gateway"
        ["gc-module-park-server"]="gc-module-park/gc-module-park-server"
        ["gc-module-industry-server"]="gc-module-industry/gc-module-industry-server"
        ["gc-module-datacenter-server"]="gc-module-datacenter/gc-module-datacenter-server"
        ["yudao-module-bpm-server"]="yudao-module-bpm/yudao-module-bpm-server"
        ["yudao-module-iot-biz"]="yudao-module-iot/yudao-module-iot-biz"
        ["yudao-module-infra-server"]="yudao-module-infra/yudao-module-infra-server"
        ["yudao-module-system-server"]="yudao-module-system/yudao-module-system-server"
      )
    - |
      for module in "${!MODULE_JAR_MAP[@]}"; do
        jar_path=${MODULE_JAR_MAP[$module]}
        echo "开始处理模块：$module (JAR路径：$jar_path)"
        
        # 构建镜像
        if docker build \
          --build-arg MODULE_NAME="$module" \
          --build-arg JAR_PATH="$jar_path" \
          -t "$DOCKER_REGISTRY/sccsgl/$module:$POD_TAG" .; then
          echo "模块[$module]镜像构建成功，开始推送..."
          # 推送镜像
          if docker push "$DOCKER_REGISTRY/sccsgl/$module:$POD_TAG"; then
            echo "模块[$module]镜像推送成功！"
          else
            echo "警告：模块[$module]镜像推送失败，继续处理下一个模块..."
          fi
        else
          echo "警告：模块[$module]镜像构建失败，继续处理下一个模块..."
        fi
      done


  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

