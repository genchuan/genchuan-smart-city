apiVersion: apps/v1
kind: Deployment
metadata:
  name: yudao-module-system-biz
  namespace: test
  labels:
    app: yudao-module-system-biz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yudao-module-system-biz
  template:
    metadata:
      labels:
        app: yudao-module-system-biz
    spec:
      containers:
      - name: yudao-module-system-biz
        image: harbor.genchuan.cn/sccsgl/yudao-module-system-biz:laster
        imagePullPolicy: Always 
        ports:
        - containerPort: 48081
        env:
        - name: NACOS_SERVER_ADDR
          value: 192.168.8.11:31591
        - name: NACOS_NAMESPACE
          value: dev
        - name: NACOS_USERNAME
          value: 
        - name: NACOS_PASSWORD
          value:
---
apiVersion: v1
kind: Service
metadata:
  name: yudao-module-system-biz
  namespace: test
spec:
  selector:
    app: yudao-module-system-biz
  ports:
    - protocol: TCP
      port: 48081
      targetPort: 48081
  type: NodePort