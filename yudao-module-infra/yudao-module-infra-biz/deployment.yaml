apiVersion: apps/v1
kind: Deployment
metadata:
  name: yudao-module-infra-biz
  namespace: test
  labels:
    app: yudao-module-infra-biz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yudao-module-infra-biz
  template:
    metadata:
      labels:
        app: yudao-module-infra-biz
    spec:
      containers:
      - name: yudao-module-infra-biz
        image: harbor.genchuan.cn/sccsgl/yudao-module-infra-biz:laster
        imagePullPolicy: Always
        ports:
        - containerPort: 48082

---
apiVersion: v1
kind: Service
metadata:
  name: yudao-module-infra-biz
  namespace: test
spec:
  selector:
    app: yudao-module-infra-biz
  ports:
    - protocol: TCP
      port: 48082
      targetPort: 48082
  type: NodePort